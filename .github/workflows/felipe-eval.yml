# Runs Ask Felipe's eval set against REAL Gemini from a GitHub runner (the ASB Mac is behind
# Securly, which blocks or stalls Gemini calls). Runs on pushes to felipe-v2, or manually. Needs the GEMINI_API_KEY secret.
name: Felipe eval (real Gemini)
on:
  push:
    branches: [felipe-v2]
  workflow_dispatch:
    inputs:
      args:
        description: "Extra run.mjs arguments (for example --representative)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests
        run: node felipe-evals/core.test.mjs
      - name: Eval against real Gemini and live fremontasb.org data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXTRA: ${{ inputs.args }}
          FELIPE_EVAL_GAP_MS: "6500"
        run: |
          cd felipe-evals && mkdir -p results
          node run.mjs --inproc --stream $EXTRA --out results/real.json > results/real.txt 2>&1 || echo "run exited with $?"
          tail -60 results/real.txt
      - name: Same representative questions on the OLD Felipe (main before v2), for a real before/after
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FELIPE_EVAL_GAP_MS: "6500"
        run: |
          cd felipe-evals && mkdir -p results
          node run.mjs --inproc --legacy-body --representative --handler ./baseline-ask.js --out results/baseline-real.json > results/baseline-real.txt 2>&1 || echo "baseline run exited with $?"
          tail -30 results/baseline-real.txt
          node run.mjs --inproc --stream --representative --out results/new-real-rep.json > results/new-real-rep.txt 2>&1 || echo "new rep run exited with $?"
          tail -30 results/new-real-rep.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: felipe-real-results
          path: felipe-evals/results/
